name: Build & Publish Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Python venv and install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\pip.exe install -r requirements.txt

      - name: Run Python tests
        shell: pwsh
        run: .venv\Scripts\python.exe -m pytest -q

      - name: Install desktop dependencies
        shell: pwsh
        working-directory: desktop
        run: npm ci

      - name: Build Windows installer & zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build-installer.ps1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            desktop/dist/Jarvis-Setup.exe
            desktop/dist/Jarvis-Setup.exe.blockmap
            desktop/dist/Jarvis-Setup.zip
            desktop/dist/latest.yml
