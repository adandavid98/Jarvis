[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-voice"
version = "0.1.0"
description = "Windows voice automation assistant using openWakeWord and Gemini Live API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fpdf2>=2.7.0",
    "google-genai>=2.3.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.18.0",
    "openwakeword>=0.6.0",
    "psutil>=6.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "sounddevice>=0.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
jarvis = "jarvis.main:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
